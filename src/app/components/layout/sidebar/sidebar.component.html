<aside class="sidebar">
  <div class="brand">
    <img
      src="../../../../assets/images/svg/logo-sicun.svg"
      alt="Logo SICUN"
      class="brand-logo"
    />
    <div class="brand-text">
      <span class="brand-title">
        VISOR DE SEGUIMIENTO DE
      </span>
      <span class="brand-subtitle">
        LEVANTAMIENTO CATASTRAL
      </span>
    </div>
  </div>
  <nav class="nav">
    <a mat-button class="btnLogout"
       (click)="abrirEstadisticas()"
       [class.active]="(uiService.showStatsWidget$ | async)"
       style="cursor: pointer;">
      <mat-icon>dashboard</mat-icon>
    </a>

    <a mat-button
       (click)="abrirReporteManzanas()"
       [class.active]="(uiService.showManzanaPanel$ | async)"
       style="cursor: pointer;">
      <mat-icon>assessment</mat-icon>
    </a>

    <a mat-button
      (click)="abrirReportePoligonos()"
       [class.active]="(uiService.showPoligonoPanel$ | async)"
       style="cursor: pointer;">
      <mat-icon>bar_chart</mat-icon>
    </a>
  </nav>


  <button class="btnLogout" (click)="logout.emit()">
    <mat-icon>logout</mat-icon>
  </button>
</aside>
