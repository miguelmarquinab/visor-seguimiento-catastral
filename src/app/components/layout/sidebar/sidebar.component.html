<aside class="sidebar">
  <div class="brand">
    <img
      src="../../../../assets/images/svg/logo-sicun.svg"
      alt="Logo SICUN"
      class="brand-logo"
    />
    <div class="brand-text">
      <span class="brand-title">
        VISOR DE SEGUIMIENTO DE
      </span>
      <span class="brand-subtitle">
        LEVANTAMIENTO CATASTRAL
      </span>
    </div>
  </div>
  <nav class="nav toolbar-icons">
    <a mat-button class="btnLogout" matTooltip="Inicio" matTooltipClass="class-tooltip"
       (click)="abrirInicio()"
       [class.active]="(uiService.view$ | async) === 'distritos'"
       style="cursor: pointer;">
      <mat-icon class="icon-header">home</mat-icon>
    </a>
    <a mat-button class="btnLogout" matTooltip="Dashboard" matTooltipClass = "class-tooltip"
       (click)="abrirEstadisticas()"
       [class.active]="(uiService.showStatsWidget$ | async)"
       style="cursor: pointer;">
      <mat-icon class="icon-header">dashboard</mat-icon>
    </a>

    <a mat-button class="btnLogout" matTooltip="Manzana" matTooltipClass = "class-tooltip"
       (click)="abrirReporteManzanas()"
       [class.active]="(uiService.showManzanaPanel$ | async)"
       style="cursor: pointer;">
      <mat-icon class="icon-header">format_shapes</mat-icon>
    </a>

    <a mat-button class="btnLogout" matTooltip="Poligono" matTooltipClass = "class-tooltip"
      (click)="abrirReportePoligonos()"
       [class.active]="(uiService.showPoligonoPanel$ | async)"
       style="cursor: pointer;">
      <mat-icon class="icon-header">pentagon</mat-icon>
    </a>
  </nav>


  <button class="btnLogout toolbar-icons" (click)="logout.emit()" matTooltip="Cerrar sesión" matTooltipClass = "class-tooltip">
    <mat-icon>logout</mat-icon>
  </button>

  <button mat-icon-button class="mobile-menu-btn" [matMenuTriggerFor]="mobileMenu">
  <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    <button mat-menu-item (click)="abrirInicio()">
      <mat-icon>home</mat-icon>
      <span>Inicio</span>
    </button>
    <button mat-menu-item (click)="abrirEstadisticas()">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </button>
    <button mat-menu-item (click)="abrirReporteManzanas()">
      <mat-icon>format_shapes</mat-icon>
      <span>Manzana</span>
    </button>
    <button mat-menu-item (click)="abrirReportePoligonos()">
      <mat-icon>pentagon</mat-icon>
      <span>Poligono</span>
    </button>
    <button mat-menu-item (click)="logout.emit()">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </mat-menu>

</aside>
