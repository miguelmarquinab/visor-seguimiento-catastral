<!-- VISTA 1: selección -->
<section *ngIf="(ui.view$ | async) === 'distritos'">
  <div class="page map">
    <div class="panel">
      <div class="toolbar conten-buscar">
        <div class="searchWrap">
          <span><mat-icon fontIcon="search"></mat-icon></span>
          <input class="search" placeholder="Buscar distrito..." [formControl]="search" (keydown)="onEnter($event)" />
        </div>

        <button class="btnPrimary" (click)="onBuscar()">
          <mat-icon fontIcon="search"></mat-icon>
        </button>
      </div>

      <div class="title-row">
        <app-lote-selector variant="inicio" [allUbigeos]="allUbigeosForLote" (loteChange)="onLoteChange($event)"></app-lote-selector>
        <div class="content-distrito">
          <h2 class="title">Distrito:</h2>
          <button type="button" class="btn-seleccionar-todos" *ngIf="!loading && itemsToDisplay.length > 0"
            (click)="todosSeleccionados ? deseleccionarTodos() : seleccionarTodos()">
            {{ todosSeleccionados ? 'Deseleccionar todos' : 'Seleccionar todos' }}
          </button>
        </div>
      </div>

      <div class="grid" *ngIf="!loading; else loadingTpl">
        <button type="button" class="card" *ngFor="let d of itemsToDisplay" (click)="toggle(d)" [class.selected]="isSelected(d)">
          <span class="check" [class.on]="isSelected(d)">✓</span>

          <div class="logoCircle" fxFlex="20" style="align-items: center;">
            <div class="content-logo-munic">
              <img src="../../../assets/images/jpg-muni/{{d.codigoUbigeo}}.jpg" class="icon-log-muni-1"
                alt="{{d.distrito}}, {{d.departamento}}, {{d.provincia}}" />
            </div>
          </div>


          <div class="name">{{ d.distrito | uppercase }}</div>
          <div class="sub">{{ d.departamento }} · {{ d.provincia }}</div>
        </button>
      </div>

      <ng-template #loadingTpl>
        <div class="loading">Cargando…</div>
      </ng-template>

      <div class="footer">
        <button class="btnAdd" [disabled]="selectedCount === 0" (click)="agregar()">
          Cargar
        </button>
      </div>
    </div>
  </div>
</section>
<app-mapa></app-mapa>
  
<section *ngIf="(ui.view$ | async) === 'mapa'" class="map-shell">

  <button class="fab-control" (click)="ui.toggleControl()" type="button" aria-label="Capas">
    <mat-icon class="icon-color-left" fontIcon="menu"></mat-icon>
  </button>

  <div class="control-modal" [class.hidden]="!(ui.showControl$ | async)">
    <div class="control-header">
      <div class="title">Reporte Espacial</div>
      <button class="close" type="button" (click)="ui.setShowControl(false)">✕</button>
    </div>
    <div class="control-body">
      <app-control-capas [embedded]="true"></app-control-capas>
    </div>
  </div>


  <div class="widget-container" [class.hidden]="!(ui.showStatsWidget$ | async)">
    <app-map-modal-reporte-mapa></app-map-modal-reporte-mapa>
  </div>

<button mat-button class="fab-control-2" matTooltip="Catálogo de Imágenes" matTooltipClass = "class-tooltip"
       style="cursor: pointer;" [matMenuTriggerFor]="menuCatalogo">
    <mat-icon class="icon-color-left material-symbols-outlined">globe_uk</mat-icon>
</button>
  <mat-menu #menuCatalogo="matMenu" class="mat-mdc-menu-panel menu-catalogo">
      <button mat-menu-item (click)="cambiarMapa('Satelital')">
        <span class="new-componet-img">
            <img class="new-img-map" alt="Mapa Open Street Map" data-mapa="OSM"
                title="Mapa Open Street Map" src="assets/images/maps/esrisatellite.png">
            <span>Mapa Satelital</span>
        </span>
      </button>

      <button mat-menu-item (click)="cambiarMapa('OSM')">
        <span class="new-componet-img">
            <img class="new-img-map" alt="Mapa Open Street Map" data-mapa="OSM"
                title="Mapa Open Street Map" src="assets/images/maps/osmmapnik.png">
            <span>Mapa Calles</span>
        </span>
      </button>

      <button mat-menu-item (click)="cambiarMapa('Topo')">
        <span class="new-componet-img">
            <img class="new-img-map" alt="Topográfico" data-mapa="Topo" 
            title="Topográfico" src="assets/images/maps/esriroad.png">
            <span>Mapa Topográfico</span>
        </span>
      </button>

      <button mat-menu-item disabled="true" style="display: none;">
        <span class="new-componet-img">
            <img class="new-img-map" alt="Topográfico" data-mapa="Topo" 
            title="Topográfico" src="assets/images/maps/vuelo.png">
            <span>Vuelo Aerofogramétrico</span>
        </span>
      </button>

      <button mat-menu-item disabled="true" style="display: none;">
        <span class="new-componet-img">
            <img class="new-img-map" alt="Topográfico" data-mapa="Topo" 
            title="Topográfico" src="assets/images/maps/map-blanco.png">
            <span>Blanco</span>
        </span>
      </button>
    </mat-menu>

</section>
