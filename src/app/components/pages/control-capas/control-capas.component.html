<div class="panel" [class.embedded]="embedded">

  <div class="panel-body" style="padding: 0;">
    <div class="row">
      <label class="label">Distritos seleccionados:</label>
      <app-distrito-multiselect
        [all]="allDistritos"
        [selected]="selectedDistritos"
        (selectedChange)="onDistritosChange($event)">
      </app-distrito-multiselect>
<!--      <button class="circle-btn" title="Configurar" (click)="openDistritoModal()">⚙</button>-->
      <button class="btn-add-distrito" (click)="showAddDistrito = true">
        <i class="icon-plus"></i>
      </button>
    </div>

    <!-- MANZANA -->
    <div class="group">
      <div class="group-header">
        <button class="chev" (click)="toggleExpandManzana()">
          {{ expandedManzana ? '▾' : '▸' }}
        </button>

        <label class="group-title">
          <input type="checkbox" checked disabled />
          <span>Manzana</span>
        </label>

        <div class="group-actions">
          <button class="round">≡</button>
          <button class="round">⇄</button>
        </div>
      </div>

      <div class="group-content" *ngIf="expandedManzana">
        <label class="item" *ngFor="let it of manzana">
          <input type="checkbox" [checked]="it.checked" (change)="onToggle(it)" />
          <span>{{ it.label }}</span>
        </label>

        <div class="opacity">
          <span>Opacidad</span>
          <input type="range" min="0.2" max="1" step="0.05" [value]="opacity" (input)="onOpacityChange($event)" />
        </div>
      </div>
    </div>

    <!-- POLIGONO (hardcode, aún sin capa) -->
    <div class="group">
      <div class="group-header">
        <button class="chev" disabled>▸</button>
        <label class="group-title muted">
          <input type="checkbox" disabled />
          <span>Polígono</span>
        </label>
        <div class="group-actions">
          <button class="round" disabled>≡</button>
          <button class="round" disabled>⇄</button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- MODAL: Agregar/Quitar Distrito -->
<div class="modal-overlay" *ngIf="showAddDistrito">
  <div class="modal">

    <div class="modal-header">
      <span>Agregar Distrito</span>
      <button class="close" (click)="showAddDistrito = false">✕</button>
    </div>

    <div class="modal-body">
      <app-distrito-multiselect
        [allDistritos]="allDistritos"
        [selected]="selectedDistritos"
        (selectedChange)="onDistritosChange($event)">
      </app-distrito-multiselect>
    </div>

    <div class="modal-footer">
      <button class="btn-primary" (click)="confirmAddDistritos()">
        Agregar
      </button>
    </div>

  </div>
</div>
