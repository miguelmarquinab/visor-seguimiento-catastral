<div class="panel" [class.embedded]="embedded">
  <div class="panel-header">
    <div class="title">
      <span class="shield">🛡️</span>
      <span>Reporte Espacial</span>
    </div>

    <button class="icon-btn" title="Centrar" (click)="centerDemo()">◎</button>
  </div>

  <div class="panel-body">
    <div class="row">
      <label class="label">Distritos seleccionados:</label>
      <select class="select">
        <option>TODOS</option>
      </select>
      <button class="circle-btn" title="Configurar">⚙</button>
    </div>

    <!-- MANZANA -->
    <div class="group">
      <div class="group-header">
        <button class="chev" (click)="toggleExpandManzana()">
          {{ expandedManzana ? '▾' : '▸' }}
        </button>

        <label class="group-title">
          <input type="checkbox" checked disabled />
          <span>Manzana</span>
        </label>

        <div class="group-actions">
          <button class="round">≡</button>
          <button class="round">⇄</button>
        </div>
      </div>

      <div class="group-content" *ngIf="expandedManzana">
        <label class="item" *ngFor="let it of manzana">
          <input type="checkbox" [checked]="it.checked" (change)="onToggle(it)" />
          <span>{{ it.label }}</span>
        </label>

        <div class="opacity">
          <span>Opacidad</span>
          <input type="range" min="0.2" max="1" step="0.05" [value]="opacity" (input)="onOpacityChange($event)" />
        </div>
      </div>
    </div>

    <!-- POLIGONO (hardcode, aún sin capa) -->
    <div class="group">
      <div class="group-header">
        <button class="chev" disabled>▸</button>
        <label class="group-title muted">
          <input type="checkbox" disabled />
          <span>Polígono</span>
        </label>
        <div class="group-actions">
          <button class="round" disabled>≡</button>
          <button class="round" disabled>⇄</button>
        </div>
      </div>
    </div>
  </div>
</div>
