<div class="panel" [class.embedded]="embedded">


  <div class="panel-body" style="padding: 0;">

    <div class="row">
      <app-lote-selector [allUbigeos]="allUbigeos" (loteChange)="onLoteChange($event)"></app-lote-selector>
    </div>
    <div class="row">
     <span class="label">Distritos:</span>
      <app-distrito-multiselect  [all]="allDistritos"  [selected]="distritosSeleccionados()"  (selectedChange)="onDistritosChange($event)"></app-distrito-multiselect>
    </div>

    <div class="group">
      <div class="group-header">
        <button class="chev" (click)="toggleExpandManzana()">{{ expandedManzana ? '▾' : '▸' }}</button>
        <label class="group-title">
          <input type="checkbox" checked disabled />
          <span>Manzana</span>
        </label>

        <div class="group-actions">
        </div>
      </div>

      <div class="group-content" *ngIf="expandedManzana">
        <label class="item" *ngFor="let it of manzana">
          <input type="checkbox" [checked]="it.checked" (change)="onToggleManzana(it)" />
          <span>{{ it.label }}</span>
        </label>
      </div>
    </div>

    <div class="group">
      <div class="group-header">
        <button class="chev" (click)="toggleExpandPoligonoPanel()">{{ expandedPoligono ? '▾' : '▸' }}</button>
        <label class="group-title">
          <input type="checkbox" checked disabled />
          <span>Polígono</span>
        </label>
        <div class="group-actions">
        </div>
      </div>
      <div class="group-content" *ngIf="expandedPoligono">
        <label class="item" *ngFor="let ip of poligonos">
          <input type="checkbox" [checked]="ip.checked" (change)="onToggle(ip)" />
          <span>{{ ip.label }}</span>
        </label>
      </div>
    </div>

    <div class="group">
      <div class="group-header">
        <button class="chev" style="opacity: 0;"></button>
        <label class="group-title">
          <input type="checkbox" [checked]="flagSector" (change)="onToggleSector()" />
          <span>Sector</span>
        </label>
        <div class="group-actions">
        </div>
      </div>
    </div>
    <div class="group">
      <div class="group-header">
        <button class="chev" style="opacity: 0;"></button>
        <label class="group-title">
          <input type="checkbox" [checked]="flagIntervencion" (change)="onToggleIntervencion()" />
          <span>Intervención</span>
        </label>
        <div class="group-actions">
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="mostrarDiv">
  <div class="modal">

    <div class="modal-header">
      <span>Agregar Distrito</span>
      <button class="close" (click)="cerrarDistritos()">✕</button>
    </div>

    <div class="modal-body">
      <app-distrito-multiselect
        [allDistritos]="allDistritos"
        [selected]="distritosSeleccionados()"
        (selectedChange)="onDistritosChange($event)">
      </app-distrito-multiselect>
    </div>

    <div class="modal-footer">
    </div>

  </div>
</div>
