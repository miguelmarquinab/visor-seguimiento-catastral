<div class="ms">
  <button type="button" class="ms-btn" (click)="toggleOpen()">
    <span class="ms-label">{{ labelSummary() }}</span>
    <span class="ms-caret">▾</span>
  </button>

  <div class="ms-panel" *ngIf="open">
    <div class="ms-search">
      <span class="icon">🔎</span>
      <input [formControl]="search" placeholder="Buscar distrito..." />
    </div>

    <div class="ms-actions">
      <button type="button" (click)="selectAllFiltered()">Marcar visibles</button>
      <button type="button" (click)="clear()">Limpiar</button>
    </div>

    <div class="ms-list">
      <label class="row" *ngFor="let d of filtered">
        <input
          type="checkbox"
          [checked]="selectedIds.has(d.idOrganizacion)"
          (change)="toggleDistrict(d)"
        />

        <!-- hidden ubigeo (si lo quieres para forms HTML5) -->
        <input type="hidden" [value]="d.codigoUbigeo" />

        <div class="txt">
          <div class="name">{{ d.distrito }}</div>
          <div class="sub">{{ d.departamento }} · {{ d.provincia }}</div>
        </div>

        <!-- ✅ Switch único: límite + centrar -->
        <button
          type="button"
          class="switch-btn"
          [class.on]="isLimiteOn(d.codigoUbigeo)"
          (click)="onToggleLimiteDistrito(d, $event)"
          title="Mostrar/ocultar límite y centrar distrito"
        >
          <span class="spinner" *ngIf="isLoadingUbigeo(d.codigoUbigeo)"></span>

          <!-- icono tipo switch -->
          <span class="switch-icon" *ngIf="!isLoadingUbigeo(d.codigoUbigeo)">
            <span class="switch-track"></span>
            <span class="switch-knob"></span>
          </span>
        </button>
      </label>
    </div>
  </div>
</div>
